version: '3'

output: prefixed

dotenv: ['.task/.env.local', '.task/.env']

includes:
  backend:
    taskfile: .taskfiles/backend.yml
    dir: .
  frontend:
    taskfile: .taskfiles/frontend.yml
    dir: frontend
  desktop:
    taskfile: .taskfiles/desktop.yml
    dir: frontend
  pre-commit:
    taskfile: .taskfiles/pre-commit.yml
    dir: .

tasks:
  default:
    desc: "List the main application commands"
    silent: true
    cmds:
      - |
        echo "Promin macOS application"
        echo ""
        echo "  task desktop:dev   Run the native app"
        echo "  task desktop:build Build the macOS app and disk image"
        echo "  task check         Run application quality checks"

  install:
    desc: "Install application development dependencies"
    cmds:
      - task: frontend:install

  dev:
    desc: "Run the native macOS application"
    cmds:
      - task: desktop:dev

  build:
    desc: "Build the macOS application"
    cmds:
      - task: desktop:build

  release:promin:
    desc: "Publish a Promin macOS release"
    cmds:
      - ./scripts/release-promin.sh {{.CLI_ARGS}}

  test:
    desc: "Run frontend, backend, and native shell tests"
    cmds:
      - task: frontend:test
      - task: backend:test
      - cmd: cd frontend/src-tauri && cargo test --lib
        platforms: [darwin]

  lint:
    desc: "Run application linters"
    cmds:
      - task: frontend:lint
      - task: comment-lint

  format:
    desc: "Format application code"
    cmds:
      - task: backend:format
      - task: frontend:format

  format:check:
    desc: "Check application code formatting"
    cmds:
      - task: backend:format:check
      - task: frontend:format:check

  comment-lint:
    desc: "Check comment quality on added lines"
    aliases: [comments]
    cmds:
      - task: pre-commit:comment-lint
        vars: { CLI_ARGS: '{{.CLI_ARGS}}' }

  comment-lint:branch:
    desc: "Check comment quality on all branch additions"
    cmds:
      - task: pre-commit:comment-lint:branch
        vars: { BASE: '{{.BASE}}' }

  fix:
    desc: "Fix application formatting and lint issues"
    cmds:
      - task: backend:format
      - task: frontend:fix

  check:
    desc: "Run application quality checks"
    cmds:
      - task: backend:check
      - task: frontend:check
      - cmd: cd frontend/src-tauri && cargo test --lib
        platforms: [darwin]

  tool-models:
    desc: "Generate frontend API types from the local backend"
    cmds:
      - task: frontend:tool-models

  tool-models:check:
    desc: "Check generated frontend API types"
    cmds:
      - task: frontend:tool-models:check

  clean:
    desc: "Remove application build artifacts"
    cmds:
      - task: backend:clean
      - task: frontend:clean
      - task: desktop:clean
