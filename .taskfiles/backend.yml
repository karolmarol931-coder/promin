version: '3'

vars:
  MAXW: '{{if .STIRLING_CHECK_JOBS}} --max-workers={{.STIRLING_CHECK_JOBS}}{{end}}'

tasks:
  build:
    desc: "Build the local backend"
    env:
      DISABLE_ADDITIONAL_FEATURES: "true"
    cmds:
      - ./gradlew :stirling-pdf:bootJar

  test:
    desc: "Run local backend tests"
    env:
      DISABLE_ADDITIONAL_FEATURES: "true"
    cmds:
      - ./gradlew :common:test :stirling-pdf:test{{.MAXW}}

  format:
    desc: "Format local backend code"
    env:
      DISABLE_ADDITIONAL_FEATURES: "true"
    cmds:
      - ./gradlew :common:spotlessApply :stirling-pdf:spotlessApply

  format:check:
    desc: "Check local backend formatting"
    env:
      DISABLE_ADDITIONAL_FEATURES: "true"
    cmds:
      - ./gradlew :common:spotlessCheck :stirling-pdf:spotlessCheck{{.MAXW}}

  check:
    desc: "Check the local backend"
    cmds:
      - task: format:check
      - task: test

  swagger:
    desc: "Generate local backend API documentation"
    run: once
    env:
      DISABLE_ADDITIONAL_FEATURES: "true"
    cmds:
      - ./gradlew :stirling-pdf:copySwaggerDoc
    sources:
      - app/core/src/main/java/**/*.java
      - app/common/src/main/java/**/*.java
    generates:
      - SwaggerDoc.json

  clean:
    desc: "Clean local backend build artifacts"
    env:
      DISABLE_ADDITIONAL_FEATURES: "true"
    cmds:
      - ./gradlew :stirling-pdf:clean :common:clean
