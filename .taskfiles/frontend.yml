version: '3'

vars:
  TEST_JOBS: '{{if .STIRLING_CHECK_JOBS}} --maxWorkers={{.STIRLING_CHECK_JOBS}}{{end}}'
  LINT_THREADS: '{{if .STIRLING_CHECK_JOBS}} --threads={{.STIRLING_CHECK_JOBS}}{{end}}'

tasks:
  install:
    desc: "Install frontend development dependencies"
    run: once
    cmds:
      - '{{if eq .CI "true"}}npm ci{{else}}npm install{{end}}'
    sources:
      - package.json
      - package-lock.json
    status:
      - npm ls --depth=0

  prepare:
    desc: "Prepare local desktop environment"
    cmds:
      - npx tsx scripts/setup-env.mts --desktop

  dev:
    desc: "Start the native macOS application"
    cmds:
      - task: ":desktop:dev"

  test:
    desc: "Run frontend tests"
    deps: [prepare]
    cmds:
      - npx vitest run --project core --project proprietary --project desktop{{.TEST_JOBS}}

  lint:
    desc: "Lint frontend code and assets"
    cmds:
      - task: lint:oxlint
      - task: lint:colors
      - task: lint:icons
      - task: lint:css

  lint:oxlint:
    desc: "Lint TypeScript and JavaScript"
    cmds:
      - npx oxlint --config oxlint.config.ts --max-warnings=0{{.LINT_THREADS}}

  lint:colors:
    desc: "Check frontend theme color usage"
    cmds:
      - node scripts/lint/theme-lint.mjs
      - node scripts/lint/theme-lint.mjs css-colors
      - node scripts/lint/theme-lint.mjs code-colors
      - node scripts/lint/theme-lint.mjs no-primitives

  lint:icons:
    desc: "Check frontend icon usage"
    cmds:
      - npx tsx scripts/lint/icon-lint.mts

  lint:css:
    desc: "Lint frontend stylesheets"
    cmds:
      - npx stylelint "{src,public}/**/*.css"

  format:
    desc: "Format frontend source files"
    cmds:
      - npx oxfmt --write .

  format:check:
    desc: "Check frontend formatting"
    cmds:
      - npx oxfmt --check .{{.LINT_THREADS}}

  typecheck:
    desc: "Typecheck the macOS application"
    deps: [prepare]
    cmds:
      - npx tsc --noEmit --project src/editor/desktop/tsconfig.json

  check:desktop-css:
    desc: "Verify desktop layout styles in the production bundle"
    cmds:
      - npx vite build --mode desktop
      - node scripts/check-desktop-css.mjs

  check:
    desc: "Check frontend types, styles, formatting, and tests"
    cmds:
      - task: typecheck
      - task: check:desktop-css
      - task: lint
      - task: format:check
      - task: test

  tool-models:
    desc: "Generate frontend API types from the local backend"
    deps: [install, ":backend:swagger"]
    cmds:
      - npx tsx scripts/generate-tool-api-types.mts --spec ../SwaggerDoc.json --output src/editor/core/types/toolApiTypes.ts --io-output src/editor/core/types/toolIO.ts

  tool-models:check:
    desc: "Check generated frontend API types"
    cmds:
      - task: tool-models
      - git diff --exit-code -- src/editor/core/types/toolApiTypes.ts src/editor/core/types/toolIO.ts

  clean:
    desc: "Clean frontend build artifacts"
    cmds:
      - >-
        node -e 'for (const p of ["node_modules/.vite", "dist", "dist-desktop"])
        require("node:fs").rmSync(p, { recursive: true, force: true })'
