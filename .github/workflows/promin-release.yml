name: Publish Promin desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version and updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("frontend/src-tauri/tauri.conf.json"))["version"])')
          if [[ "v$version" != "$TAG_NAME" ]]; then
            echo "::error::Tag $TAG_NAME must match the app version v$version."
            exit 1
          fi

          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done

  release:
    needs: preflight
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/tauri-build.yml
    secrets: inherit
    with:
      platform: macos
      allow_unsigned_macos: true
      sign: false
      minimal: false
      use_shared_cache: false
      release: true
      release_body: |
        Универсальная сборка подходит для Mac с процессором Intel и Apple Silicon.

        **Установка:** скачайте и откройте DMG, перетащите Promin в Applications, затем запустите его из Applications. Если macOS заблокирует запуск, откройте «Системные настройки» → «Конфиденциальность и безопасность», нажмите «Открыть всё равно» для Promin и подтвердите запуск. Подробная инструкция: https://github.com/karolmarol931-coder/promin/blob/main/docs/PROMIN_INSTALL_MACOS_RU.md

        Из-за отсутствия Apple Developer ID и нотариализации macOS требует это ручное подтверждение. Скачивайте Promin только из официального раздела: https://github.com/karolmarol931-coder/promin/releases/latest

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });

            if (!release.draft) {
              core.setFailed(`Release ${tag} is not a draft.`);
              return;
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
            });
